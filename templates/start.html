{% include "header.html" %}

<style>

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

.login-card{
    width:450px;
    border-radius:20px;
    overflow:hidden;
    position:relative;

    background-image:url("{{ url_for('static', filename='breakout.gif') }}");
    background-size:cover;
    background-position:center;
}

.login-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
}

.login-card .card-body{
    position:relative;
    z-index:1;
    color:white;
}

.login-card h1{
    text-shadow:2px 2px 10px rgba(0,0,0,0.8);
}

.login-card p{
    color:#d9d9d9;
}

</style>

<section class="hero">


<div class="card login-card shadow-lg border-0">
    <div class="card-body text-center p-5">


<h1 class="display-5 fw-bold mb-3">🎮Breakout</h1>
<p class="mb-4">Please login or create an account to play.</p>

<div class="d-grid gap-3">

                <a href="{{ url_for('login') }}"
                   class="btn btn-primary btn-lg">
                    Login
                </a>

                <a href="{{ url_for('register') }}"
                   class="btn btn-success btn-lg">
                    Sign Up
                </a>

            </div>
    </div>
        </div>

</section>
